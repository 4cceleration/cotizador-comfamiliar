<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizaciones · Comfamiliar Risaralda</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css?v=25">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/areas">
      <img src="assets/logo-comfamiliar.png" alt="Comfamiliar Risaralda">
      <span class="brand-sep"></span>
      <span class="brand-txt"><b>Cotizaciones</b></span>
    </a>
    <nav class="nav">
      <a href="#/areas" data-nav="areas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Áreas</span></a>
      <a href="#/solicitar" data-nav="solicitar" class="nav-cta"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg><span>Solicitar</span></a>
      <a href="#/solicitudes" data-nav="solicitudes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/></svg><span>Solicitudes</span><span class="count" id="navCount"></span></a>
    </nav>
    <a class="btn primary" href="#/solicitar">Solicitar cotización</a>
    <button type="button" class="ghost" data-act="salir">Salir</button>
  </header>

  <section id="login" class="login" hidden>
    <form id="formLogin" class="login-card">
      <img src="assets/logo-comfamiliar.png" alt="Comfamiliar Risaralda" class="login-logo">
      <button class="primary">Ingresar</button>
    </form>
  </section>

  <main id="app"></main>

  <!-- Crear / editar área -->
  <dialog id="dlgArea">
    <form method="dialog" id="formArea">
      <div class="dialog-head">
        <h2 id="dlgAreaTitle">Nueva área</h2>
        <button class="ghost" value="cancel" formnovalidate aria-label="Cerrar">✕</button>
      </div>
      <div class="grid">
        <label class="span-2">Nombre del área *
          <input name="nombre" required placeholder="Ej.: Marketing">
        </label>
        <label class="span-2">Descripción
          <textarea name="descripcion" rows="2" placeholder="Qué servicios ofrece esta área"></textarea>
        </label>
        <label>Responsable
          <input name="responsable" placeholder="Nombre de quien cotiza">
        </label>
        <label>Correo del área
          <input name="email" type="email" placeholder="area@comfamiliar.com">
        </label>
      </div>
      <div class="dialog-foot">
        <button value="cancel" formnovalidate>Cancelar</button>
        <button class="primary" value="ok">Guardar área</button>
      </div>
    </form>
  </dialog>

  <a class="fab" href="#/solicitar" aria-label="Solicitar cotización"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=20"></script>
</body>
</html>
